<app-auth-screen>
  <app-brand-lockup />
  <header class="auth-head">
    <h1>{{ 'reset.title' | transloco }}</h1>
    <p>{{ 'reset.subtitle' | transloco }}</p>
  </header>
  <form class="auth-form" (submit)="onSubmit($event)" novalidate>
    <label class="auth-field">
      <span>{{ 'reset.password' | transloco }}</span>
      <div class="input-box">
        <input
          [type]="show() ? 'text' : 'password'"
          [formField]="resetForm.password"
          autocomplete="new-password"
        />
        <button class="toggle-visibility" type="button" (click)="show.set(!show())">
          <img [src]="show() ? 'icons/eye.svg' : 'icons/eye-off.svg'" width="18" height="18" alt="" />
        </button>
      </div>
      <app-field-error [state]="resetForm.password()" />
    </label>
    <label class="auth-field">
      <span>{{ 'reset.confirm' | transloco }}</span>
      <div class="input-box">
        <input
          [type]="showConfirm() ? 'text' : 'password'"
          [formField]="resetForm.confirm"
          autocomplete="new-password"
        />
        <button class="toggle-visibility" type="button" (click)="showConfirm.set(!showConfirm())">
          <img [src]="showConfirm() ? 'icons/eye.svg' : 'icons/eye-off.svg'" width="18" height="18" alt="" />
        </button>
      </div>
      <app-field-error [state]="resetForm.confirm()" />
    </label>
    <p class="hint">{{ 'reset.hint' | transloco }}</p>
    <div class="form-actions">
      <button class="auth-cta" type="submit" [disabled]="resetForm().submitting()">
        {{ 'reset.submit' | transloco }}
      </button>
      <a class="auth-link strong" routerLink="/login">{{ 'forgot.back' | transloco }}</a>
    </div>
  </form>
</app-auth-screen>
