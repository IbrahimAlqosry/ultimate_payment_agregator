<app-auth-screen>
  <app-brand-lockup />
  <div class="icon-header">
    <span class="glyph">
      <img src="/icons/check-circle.svg" width="32" height="32" alt="" />
    </span>
  </div>
  <header class="auth-head">
    <h1>{{ 'sent.title' | transloco }}</h1>
    <p>{{ 'sent.subtitle' | transloco }}</p>
  </header>
  <div class="form-actions">
    <p class="register-row">
      <span>{{ 'sent.missing' | transloco }}</span>
      <button class="auth-link strong" type="button" (click)="resend()">{{ 'sent.resend' | transloco }}</button>
    </p>
    <a class="auth-cta" routerLink="/reset-password">{{ 'sent.continue' | transloco }}</a>
    <a class="auth-link strong" routerLink="/login">{{ 'forgot.back' | transloco }}</a>
  </div>
</app-auth-screen>
