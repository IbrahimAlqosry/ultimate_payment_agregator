<app-auth-screen>
  <app-brand-lockup />

  <header class="auth-head">
    <h1>{{ 'login.title' | transloco }}</h1>
    <p>{{ 'login.subtitle' | transloco }}</p>
  </header>

  <form class="auth-form" (submit)="onSubmit($event)" novalidate>
    <label class="auth-field">
      <span>{{ 'login.email' | transloco }}</span>
      <div class="input-box">
        <input
          type="email"
          [formField]="loginForm.email"
          autocomplete="username"
          [placeholder]="'login.emailPlaceholder' | transloco"
        />
      </div>
      <app-field-error [state]="loginForm.email()" />
    </label>

    <div>
      <label class="auth-field">
        <span>{{ 'login.password' | transloco }}</span>
        <div class="input-box">
          <input
            [type]="showPassword() ? 'text' : 'password'"
            [formField]="loginForm.password"
            autocomplete="current-password"
            placeholder="••••••••"
          />
          <button
            class="toggle-visibility"
            type="button"
            (click)="showPassword.set(!showPassword())"
            [attr.aria-label]="(showPassword() ? 'login.hidePassword' : 'login.showPassword') | transloco"
          >
            <img
              [src]="showPassword() ? 'icons/eye.svg' : 'icons/eye-off.svg'"
              width="18"
              height="18"
              alt=""
            />
          </button>
        </div>
        <app-field-error [state]="loginForm.password()" />
      </label>
      <div class="forgot-row">
        <a class="auth-link" routerLink="/forgot-password">{{ 'login.forgot' | transloco }}</a>
      </div>
    </div>

    @if (apiError()) {
      <p class="form-error" role="alert">
        {{ 'login.invalid' | transloco }}
        <a class="auth-link" routerLink="/set-password" [queryParams]="{ email: loginForm.email().value() }">
          {{ 'login.firstTime' | transloco }}
        </a>
      </p>
    }

    <div class="form-actions">
      <button class="auth-cta" type="submit" [disabled]="loginForm().submitting()">
        {{ (loginForm().submitting() ? 'login.submitting' : 'login.submit') | transloco }}
      </button>
      <p class="register-row">
        <span>{{ 'login.newHere' | transloco }}</span>
        <a class="auth-link strong" routerLink="/register">{{ 'login.register' | transloco }}</a>
      </p>
    </div>
  </form>
</app-auth-screen>
