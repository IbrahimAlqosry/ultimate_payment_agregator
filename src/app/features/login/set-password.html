<app-auth-screen>
  <app-brand-lockup />

  <div class="role-switch role-switch-2" role="tablist" [attr.aria-label]="'setPassword.audience' | transloco">
    @for (option of audiences; track option.id) {
      <button
        type="button"
        role="tab"
        [class.active]="audience() === option.id"
        [attr.aria-selected]="audience() === option.id"
        (click)="selectAudience(option.id)"
      >
        {{ option.label | transloco }}
      </button>
    }
  </div>

  <header class="auth-head">
    <h1>{{ 'setPassword.title' | transloco }}</h1>
    <p>{{ 'setPassword.subtitle' | transloco }}</p>
  </header>

  <form class="auth-form" (submit)="onSubmit($event)" novalidate>
    <label class="auth-field">
      <span>{{ 'setPassword.email' | transloco }}</span>
      <div class="input-box">
        <input type="email" [formField]="setPasswordForm.email" autocomplete="username" />
      </div>
      <app-field-error [state]="setPasswordForm.email()" />
    </label>

    <label class="auth-field">
      <span>{{ 'setPassword.temporary' | transloco }}</span>
      <div class="input-box">
        <input
          [type]="showTemp() ? 'text' : 'password'"
          [formField]="setPasswordForm.temporaryPassword"
          autocomplete="one-time-code"
        />
        <button
          class="toggle-visibility"
          type="button"
          (click)="showTemp.set(!showTemp())"
          [attr.aria-label]="(showTemp() ? 'login.hidePassword' : 'login.showPassword') | transloco"
        >
          <img [src]="showTemp() ? 'icons/eye.svg' : 'icons/eye-off.svg'" width="18" height="18" alt="" />
        </button>
      </div>
      <app-field-error [state]="setPasswordForm.temporaryPassword()" />
    </label>

    <label class="auth-field">
      <span>{{ 'setPassword.newPassword' | transloco }}</span>
      <div class="input-box">
        <input
          [type]="show() ? 'text' : 'password'"
          [formField]="setPasswordForm.newPassword"
          autocomplete="new-password"
        />
        <button
          class="toggle-visibility"
          type="button"
          (click)="show.set(!show())"
          [attr.aria-label]="(show() ? 'login.hidePassword' : 'login.showPassword') | transloco"
        >
          <img [src]="show() ? 'icons/eye.svg' : 'icons/eye-off.svg'" width="18" height="18" alt="" />
        </button>
      </div>
      <app-field-error [state]="setPasswordForm.newPassword()" />
    </label>

    <label class="auth-field">
      <span>{{ 'setPassword.confirm' | transloco }}</span>
      <div class="input-box">
        <input
          [type]="showConfirm() ? 'text' : 'password'"
          [formField]="setPasswordForm.confirm"
          autocomplete="new-password"
        />
        <button
          class="toggle-visibility"
          type="button"
          (click)="showConfirm.set(!showConfirm())"
          [attr.aria-label]="(showConfirm() ? 'login.hidePassword' : 'login.showPassword') | transloco"
        >
          <img [src]="showConfirm() ? 'icons/eye.svg' : 'icons/eye-off.svg'" width="18" height="18" alt="" />
        </button>
      </div>
      <app-field-error [state]="setPasswordForm.confirm()" />
    </label>

    @if (apiError()) {
      <p class="form-error" role="alert">{{ 'setPassword.invalid' | transloco }}</p>
    }

    <div class="form-actions">
      <button class="auth-cta" type="submit" [disabled]="setPasswordForm().submitting()">
        {{ (setPasswordForm().submitting() ? 'setPassword.submitting' : 'setPassword.submit') | transloco }}
      </button>
      <a class="auth-link strong" routerLink="/login">{{ 'forgot.back' | transloco }}</a>
    </div>
  </form>
</app-auth-screen>
