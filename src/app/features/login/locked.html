<app-auth-screen>
  <app-brand-lockup />
  <div class="icon-header warning">
    <span class="glyph">
      <img src="icons/shield-alert.svg" width="32" height="32" alt="" />
    </span>
  </div>
  <header class="auth-head">
    <h1>{{ 'locked.title' | transloco }}</h1>
    <p>{{ 'locked.subtitle' | transloco }}</p>
  </header>
  <div class="form-actions">
    <a class="auth-cta" routerLink="/login">{{ 'locked.back' | transloco }}</a>
    <p class="support">{{ 'locked.support' | transloco }}</p>
  </div>
</app-auth-screen>
