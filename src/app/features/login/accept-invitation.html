<app-auth-screen>
  <app-brand-lockup />

  <header class="auth-head">
    <h1>{{ 'acceptInvitation.title' | transloco }}</h1>
    <p>{{ 'acceptInvitation.subtitle' | transloco }}</p>
  </header>

  <form class="auth-form" (submit)="onSubmit($event)" novalidate>
    <label class="auth-field">
      <span>{{ 'acceptInvitation.secret' | transloco }}</span>
      <div class="input-box">
        <input
          [type]="showSecret() ? 'text' : 'password'"
          [formField]="form.invitationSecret"
          autocomplete="one-time-code"
        />
        <button
          class="toggle-visibility"
          type="button"
          (click)="showSecret.set(!showSecret())"
          [attr.aria-label]="(showSecret() ? 'login.hidePassword' : 'login.showPassword') | transloco"
        >
          <img [src]="showSecret() ? 'icons/eye.svg' : 'icons/eye-off.svg'" width="18" height="18" alt="" />
        </button>
      </div>
      <app-field-error [state]="form.invitationSecret()" />
    </label>

    <label class="auth-field">
      <span>{{ 'acceptInvitation.password' | transloco }}</span>
      <div class="input-box">
        <input [type]="show() ? 'text' : 'password'" [formField]="form.password" autocomplete="new-password" />
        <button
          class="toggle-visibility"
          type="button"
          (click)="show.set(!show())"
          [attr.aria-label]="(show() ? 'login.hidePassword' : 'login.showPassword') | transloco"
        >
          <img [src]="show() ? 'icons/eye.svg' : 'icons/eye-off.svg'" width="18" height="18" alt="" />
        </button>
      </div>
      <app-field-error [state]="form.password()" />
    </label>

    <label class="auth-field">
      <span>{{ 'acceptInvitation.confirm' | transloco }}</span>
      <div class="input-box">
        <input
          [type]="showConfirm() ? 'text' : 'password'"
          [formField]="form.confirm"
          autocomplete="new-password"
        />
        <button
          class="toggle-visibility"
          type="button"
          (click)="showConfirm.set(!showConfirm())"
          [attr.aria-label]="(showConfirm() ? 'login.hidePassword' : 'login.showPassword') | transloco"
        >
          <img [src]="showConfirm() ? 'icons/eye.svg' : 'icons/eye-off.svg'" width="18" height="18" alt="" />
        </button>
      </div>
      <app-field-error [state]="form.confirm()" />
    </label>

    @if (apiError()) {
      <p class="form-error" role="alert">{{ 'acceptInvitation.invalid' | transloco }}</p>
    }

    <div class="form-actions">
      <button class="auth-cta" type="submit" [disabled]="form().submitting()">
        {{ (form().submitting() ? 'acceptInvitation.submitting' : 'acceptInvitation.submit') | transloco }}
      </button>
      <a class="auth-link strong" routerLink="/login">{{ 'forgot.back' | transloco }}</a>
    </div>
  </form>
</app-auth-screen>
