<section class="page">
  <p class="crumb">{{ 'onboard.merchantCrumb' | transloco }}</p>
  <header class="page-head">
    <h1>{{ 'onboard.merchantTitle' | transloco }}</h1>
  </header>

  <form class="form-card" (submit)="onSubmit($event)" novalidate>
    <div class="form-grid">
      <label class="form-field">
        <span>{{ 'register.legalName' | transloco }}</span>
        <input [formField]="form.legalName" [placeholder]="'register.legalNamePh' | transloco" />
        <app-field-error [state]="form.legalName()" />
      </label>
      <label class="form-field">
        <span>{{ 'register.contactName' | transloco }}</span>
        <input [formField]="form.contactName" [placeholder]="'register.contactNamePh' | transloco" />
        <app-field-error [state]="form.contactName()" />
      </label>
      <label class="form-field">
        <span>{{ 'register.cr' | transloco }}</span>
        <input [formField]="form.commercialRegistrationNumber" [placeholder]="'register.crPh' | transloco" />
        <app-field-error [state]="form.commercialRegistrationNumber()" />
      </label>
      <label class="form-field">
        <span>{{ 'register.email' | transloco }}</span>
        <input type="email" [formField]="form.email" [placeholder]="'register.emailPh' | transloco" />
        <app-field-error [state]="form.email()" />
      </label>
      <label class="form-field">
        <span>{{ 'register.phone' | transloco }}</span>
        <input [formField]="form.phone" [placeholder]="'register.phonePh' | transloco" />
        <app-field-error [state]="form.phone()" />
      </label>
      <label class="form-field">
        <span>{{ 'register.erp' | transloco }}</span>
        <input [formField]="form.erpSystemId" [placeholder]="'register.erpPh' | transloco" />
        <p class="field-hint">{{ 'register.erpHint' | transloco }}</p>
        <app-field-error [state]="form.erpSystemId()" />
      </label>
    </div>
    @if (apiError(); as message) {
      <p class="form-error" role="alert">{{ message }}</p>
    }
    <div class="form-actions">
      <button class="cta" type="submit" [disabled]="form().submitting()">
        {{ (form().submitting() ? 'onboard.submitting' : 'onboard.submitApproval') | transloco }}
      </button>
      <a class="cancel-link" routerLink="/merchants">{{ 'actions.cancel' | transloco }}</a>
    </div>
  </form>
</section>
