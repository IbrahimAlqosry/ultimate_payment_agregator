# Static SPA serving only -- no API proxy (environment.uat.ts calls uat-apinoti.ultimate-pay.net
# directly). Plain config, no envsubst/template needed since there's no backend target to inject.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Static assets -- long-cache, filenames are content-hashed by the Angular build.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Angular router (html5 pushState) -- anything else falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
